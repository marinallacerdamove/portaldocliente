# Deploy real deste servidor. Substitui a rotina manual de "docker run" +
# renomear container antigo a cada deploy. Ver PORTAL_FORK_README.md.
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate rails sidekiq
#
# Segredos reais ficam em .env.production (fora do git, ver .env.production.example).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

networks:
  default:
    name: chatwoot_default
    external: true

volumes:
  chatwoot_storage_data:
    external: true
  backend_chatwoot_pgdata:
    external: true
  chatwoot_redis_persist_data:

services:
  postgres:
    image: ankane/pgvector:latest@sha256:956744bd14e9cbdf639c61c2a2a7c7c2c48a9c8cdd42f7de4ac034f4e96b90f8
    container_name: backend-postgres-1
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: chatwoot_production
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - backend_chatwoot_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine@sha256:09160599abd229764c0fb44cb6be640294e1d360a54b19985ab4843dcf2d90f1
    container_name: backend-redis-1
    restart: always
    logging: *default-logging
    volumes:
      - chatwoot_redis_persist_data:/data
    command: ["redis-server", "--save", "60", "1"]

  rails:
    image: chatwoot-custom:v4.17.1-ticketmodal107
    container_name: chatwoot-rails-1
    restart: always
    logging: *default-logging
    env_file: .env.production
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - chatwoot_storage_data:/app/storage
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    depends_on:
      - postgres
      - redis

  sidekiq:
    image: chatwoot-custom:v4.17.1-ticketmodal107
    container_name: chatwoot-sidekiq-1
    restart: always
    logging: *default-logging
    env_file: .env.production
    volumes:
      - chatwoot_storage_data:/app/storage
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      - postgres
      - redis

  glitchtip:
    image: glitchtip/glitchtip:latest@sha256:95e0e2d6b1bc18446902ae0cb47910cc55d7c0d6756ee901b0cd8dce9f8ef5a9
    container_name: glitchtip
    restart: always
    logging: *default-logging
    env_file: .env.glitchtip
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      - postgres
      - redis
